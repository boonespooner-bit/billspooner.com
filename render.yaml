# Render Blueprint — auto-deploy the site as a Static Site.
# Commit this file at the repo root. When you create a new service on Render
# from this repo, Render detects render.yaml and wires everything up.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: billspooner-com
    runtime: static
    # Plain HTML/CSS/JS — no real build step, so this is just a no-op.
    buildCommand: echo "no build needed"
    staticPublishPath: .
    # Render will auto-deploy on every push to the branch you pick in the UI.
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /site.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      # Allow /about, /tubes, /music without trailing slash.
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /beans
        destination: /beans/index.html
      - type: rewrite
        source: /tubes
        destination: /tubes/index.html
      - type: rewrite
        source: /music
        destination: /music/index.html
      - type: rewrite
        source: /songs
        destination: /songs/index.html
      - type: rewrite
        source: /shows
        destination: /shows/index.html
      # Preserve ranking from the old /bio.html result with a real 301.
      # bio.html is kept on disk as a meta-refresh fallback in case a
      # static file takes precedence over this rule.
      - type: redirect
        source: /bio.html
        destination: /about/
